<body>
    <form method="POST" action="http://localhost:8080/tema5maven/rest/personas/form">
        <h1>Formulario</h1>
        <input type="number" name="id" placeholder="id"><br><br>
        <input type="text" name="nombre" placeholder="Nombre"><br><br>

        <input type="radio" name="casado" checked value="true"><label for="genero1">Casado</label>
