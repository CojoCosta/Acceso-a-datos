<!DOCTYPE html>
<html>
<body>
    <h1>Formulario</h1>
    <input type="number" name="id" id="id" placeholder="id">
    <br><br>
    <input type="text" name="nombre" id="nombre" placeholder="Nombre">
    <br><br>
    <span>Estado civil:</span>
    <input type="radio" name="casado" id="casado" checked value="true">
    <label for="genero1">Casado</label>
    <input type="radio" name="casado" id="soltero" value="false">
    <label for="genero2">Soltero</label>
    <br>
    <span>Sexo:</span>
    <input type="radio" name="genero" id="genero1" checked value="hombre">
    <label for="genero1">Hombre</label>
    <input type="radio" name="genero" id="genero2" value="mujer">
    <label for="genero2">Mujer</label>
</body>
</html>
